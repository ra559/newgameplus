<nav class="menu" id="site-menu">
  <div class="menu-header">
    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-list">
      ☰ Chapters
    </button>
    <div class="menu-title">Chapters</div>
  </div>
  <ul id="menu-list" class="menu-list">
    {% assign chapters = site.posts | sort: 'date' %}
    {% for post in chapters %}
      <li>
        <a href="{{ post.url | relative_url }}" {% if post.url == page.url %}class="is-active"{% endif %}>
          {{ post.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
