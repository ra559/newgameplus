<nav class="menu">
  <div class="menu-title">Chapters</div>
  <ul class="menu-list">
    {% assign chapters = site.posts | sort: 'date' %}
    {% for post in chapters %}
      <li>
        <a href="{{ post.url | relative_url }}" {% if post.url == page.url %}class="is-active"{% endif %}>
          {{ post.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
