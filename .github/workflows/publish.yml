name: Publish Gem

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build gem
        run: bundle exec gem build jekyll-theme-bobby.gemspec

      - name: Publish gem
        if: startsWith(github.ref, 'refs/tags/v') && secrets.RUBYGEMS_API_KEY
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: bundle exec gem push jekyll-theme-bobby-${GITHUB_REF_NAME}.gem
